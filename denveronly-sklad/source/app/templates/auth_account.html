{% extends "base.html" %}
{% block title %}{{ _("Мой аккаунт") }}{% endblock %}
{% block content %}
<h1>{{ _("Мой аккаунт") }}</h1>
<p class="muted">{{ _("Логин") }}: <b>{{ current_user.username }}</b> · {{ _("роль") }}: {{ _(ROLES[current_user.role]) }}</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" class="card grid" style="max-width:640px">
  <label class="full">{{ _("Имя") }}<input name="full_name" value="{{ current_user.full_name or '' }}"></label>
  <label class="full">{{ _("Текущий пароль") }}<input type="password" name="current" required autocomplete="current-password"></label>
  <label>{{ _("Новый пароль") }}<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <label>{{ _("Новый пароль ещё раз") }}<input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
  <div class="full"><button>{{ _("Сохранить") }}</button></div>
</form>
{% endblock %}
