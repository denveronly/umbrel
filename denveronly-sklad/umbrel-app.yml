releaseNotes: >-
  Нова вкладка «Економіка → План цін»: усі заплановані підвищення одним списком — кому, з якої дати, скільки зараз і скільки буде; дату, відсоток, ціну за м² чи суму за місяць можна змінити прямо в таблиці. 1.54.1: кнопка «З'їхав» і в картці складу: звільняє лише цей склад з датою виїзду, оренда за місяць виїзду — по днях. В історії оренди — хто, за скільки, коли в'їхав і коли з'їхав (позначка «З'їхав»). 1.54.0: кнопка «З'їхав» у картці орендаря, червоний «!» на вільних складах на мапі, заплановані підвищення цін із прогнозом в «Економіці».
