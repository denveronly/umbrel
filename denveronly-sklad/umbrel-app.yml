  - https://raw.githubusercontent.com/denveronly/umbrel/main/denveronly-sklad/assets/3.jpg
releaseNotes: >-
  Орендарі: шапка таблиці з назвами колонок більше не з'їжджає під меню при прокрутці донизу — таблиця
  гортається разом зі сторінкою, шапка прилипає під меню, рядок «Разом» — над кнопкою «Зберегти».
  З 1.7.4: підписи складів на мапі вміщуються у свій контур.
