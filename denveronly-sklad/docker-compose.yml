services:

  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: denveronly-sklad_app_1
      APP_PORT: 8080
      # У приложения свой вход по логину/паролю (главный админ создаётся при первом запуске)
      PROXY_AUTH_ADD: "false"

  app:
    # Образ собирается GitHub Actions из ./source (workflow .github/workflows/sklad-image.yml)
    image: ghcr.io/denveronly/sklad:1.2.0
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      # база, фото объектов, план территории, бэкапы
      - ${APP_DATA_DIR}/data:/data
    environment:
      TZ: Europe/Kyiv
