manifestVersion: 1.1
id: denveronly-frigate
category: automation
name: Frigate (no auth)
version: "0.18.2-1"
tagline: Frigate NVR without forced login, with 1 GB shared memory
icon: https://getumbrel.github.io/umbrel-apps-gallery/frigate/icon.svg
description: >-
  Frigate NVR with AI object detection, packaged for this store.


  Differences from the official Umbrel Frigate app:


  - Does not force `auth: enabled: True` on every start. Frigate's own login is
  off by default, and whatever you set in config.yml stays as you set it.


  - shm_size is 1 GB (enough for ~8 cameras) instead of 128 MB.


  Note: with Frigate auth off and no Umbrel login in front, the web UI on this
  port is open to anyone on the LAN. Keep it LAN-only.


  Uses the same RTSP/WebRTC ports as the official app (8554, 8555), so stop or
  uninstall the official Frigate before starting this one.
releaseNotes: >-
  Frigate 0.18.2. Full release notes: https://github.com/blakeblackshear/frigate/releases/tag/v0.18.2
developer: Blake Blackshear
website: https://frigate.video/
repo: https://github.com/blakeblackshear/frigate
support: https://github.com/blakeblackshear/frigate/issues
port: 60087
gallery: []
path: ""
defaultUsername: ""
deterministicPassword: true
dependencies: []
permissions:
  - GPU
submitter: denveronly
submission: https://github.com/denveronly/umbrel
